<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Frontend</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
        }

        button:hover {
            background: #5568d3;
        }

        .logout-btn {
            background: #e74c3c;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        .error {
            color: #e74c3c;
            margin-top: 10px;
            padding: 10px;
            background: #ffeaea;
            border-radius: 5px;
        }

        .success {
            color: #27ae60;
            margin-top: 10px;
            padding: 10px;
            background: #eafaf1;
            border-radius: 5px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: #f9f9f9;
        }

        .product-card h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .product-price {
            color: #667eea;
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0;
        }

        .product-description {
            color: #666;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .auth-switch {
            margin-top: 15px;
            text-align: center;
            color: #666;
        }

        .auth-switch a {
            color: #667eea;
            cursor: pointer;
            text-decoration: underline;
        }

        .auth-switch a:hover {
            color: #5568d3;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Login Form -->
        <div id="loginCard" class="card">
            <h1>Login</h1>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="user@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button onclick="login()">Login</button>
            <div id="loginError" class="error hidden"></div>
            <div id="loginSuccess" class="success hidden"></div>
            <div class="auth-switch">
                Don't have an account? <a onclick="showSignup()">Sign up</a>
            </div>
        </div>

        <!-- Signup Form -->
        <div id="signupCard" class="card hidden">
            <h1>Sign Up</h1>
            <div class="form-group">
                <label for="signupEmail">Email:</label>
                <input type="email" id="signupEmail" placeholder="user@example.com" required>
            </div>
            <div class="form-group">
                <label for="signupPassword">Password:</label>
                <input type="password" id="signupPassword" placeholder="Enter password" required>
            </div>
            <button onclick="signup()">Sign Up</button>
            <div id="signupError" class="error hidden"></div>
            <div id="signupSuccess" class="success hidden"></div>
            <div class="auth-switch">
                Already have an account? <a onclick="showLogin()">Login</a>
            </div>
        </div>

        <!-- Products View -->
        <div id="productsCard" class="card hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h1>Products</h1>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
            <div id="productsContainer">
                <div class="loading">Loading products...</div>
            </div>
        </div>
    </div>

    <script>
        const USER_API = 'http://localhost:8001/users';
        const PRODUCT_API = 'http://localhost:8002/products';

        // Check if user is already logged in and verify services are running
        window.onload = function () {
            const token = localStorage.getItem('token');
            if (token) {
                showProducts();
                loadProducts();
            } else {
                // Test if services are reachable
                testServices();
            }
        };

        // Test if services are running
        async function testServices() {
            try {
                const userResponse = await fetch('http://localhost:8001/');
                const productResponse = await fetch('http://localhost:8002/');

                if (!userResponse.ok || !productResponse.ok) {
                    console.warn('Services might not be fully running');
                }
            } catch (error) {
                console.error('Failed to connect to services:', error);
                alert('⚠️ Cannot connect to services!\n\nPlease make sure:\n1. User service is running on port 8001\n2. Product service is running on port 8002\n3. Open this page via http://localhost (not file://)\n\nStart services with:\ndocker-compose up\nor\npython -m uvicorn app.main:app --port 8001 (for user service)\npython -m uvicorn app.main:app --port 8002 (for product service)');
            }
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            const successDiv = document.getElementById('loginSuccess');

            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            if (!email || !password) {
                errorDiv.textContent = 'Please enter email and password';
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch(`${USER_API}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Store token
                    localStorage.setItem('token', data.access_token);
                    successDiv.textContent = 'Login successful! Redirecting...';
                    successDiv.classList.remove('hidden');

                    // Show products after a short delay
                    setTimeout(() => {
                        showProducts();
                        loadProducts();
                    }, 500);
                } else {
                    errorDiv.textContent = data.detail || 'Login failed';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'Error: ' + error.message;
                errorDiv.classList.remove('hidden');
            }
        }

        async function loadProducts() {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '<div class="loading">Loading products...</div>';

            try {
                const response = await fetch(`${PRODUCT_API}/`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                const products = await response.json();

                if (response.ok && products.length > 0) {
                    let html = '<div class="products-grid">';
                    products.forEach(product => {
                        html += `
                            <div class="product-card">
                                <h3>${product.name}</h3>
                                <div class="product-price">$${product.price.toFixed(2)}</div>
                                <div class="product-description">${product.description}</div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<div class="error">No products found</div>';
                }
            } catch (error) {
                container.innerHTML = `<div class="error">Error loading products: ${error.message}</div>`;
            }
        }

        function showProducts() {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('signupCard').classList.add('hidden');
            document.getElementById('productsCard').classList.remove('hidden');
        }

        async function signup() {
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const errorDiv = document.getElementById('signupError');
            const successDiv = document.getElementById('signupSuccess');

            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            if (!email || !password) {
                errorDiv.textContent = 'Please enter email and password';
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch(`${USER_API}/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    successDiv.textContent = 'Account created successfully! Logging in...';
                    successDiv.classList.remove('hidden');

                    // Automatically log in after signup
                    setTimeout(async () => {
                        try {
                            const loginResponse = await fetch(`${USER_API}/login`, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                },
                                body: JSON.stringify({ email, password })
                            });

                            const loginData = await loginResponse.json();

                            if (loginResponse.ok) {
                                localStorage.setItem('token', loginData.access_token);
                                showProducts();
                                loadProducts();
                            } else {
                                // If auto-login fails, show login form
                                showLogin();
                                document.getElementById('email').value = email;
                                errorDiv.textContent = 'Account created! Please log in.';
                                errorDiv.classList.remove('hidden');
                            }
                        } catch (error) {
                            showLogin();
                            document.getElementById('email').value = email;
                            errorDiv.textContent = 'Account created! Please log in.';
                            errorDiv.classList.remove('hidden');
                        }
                    }, 1000);
                } else {
                    errorDiv.textContent = data.detail || 'Signup failed';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'Error: ' + error.message;
                errorDiv.classList.remove('hidden');
            }
        }

        function showSignup() {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('signupCard').classList.remove('hidden');
            document.getElementById('loginError').classList.add('hidden');
            document.getElementById('loginSuccess').classList.add('hidden');
        }

        function showLogin() {
            document.getElementById('signupCard').classList.add('hidden');
            document.getElementById('loginCard').classList.remove('hidden');
            document.getElementById('signupError').classList.add('hidden');
            document.getElementById('signupSuccess').classList.add('hidden');
        }

        function logout() {
            localStorage.removeItem('token');
            document.getElementById('loginCard').classList.remove('hidden');
            document.getElementById('productsCard').classList.add('hidden');
            document.getElementById('signupCard').classList.add('hidden');
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('signupEmail').value = '';
            document.getElementById('signupPassword').value = '';
        }
    </script>
</body>

</html>
